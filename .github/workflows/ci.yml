# The test suite is stable, so the repo gets CI. The test and bundle steps are
# offline and deterministic (stdlib only); the one network step restores the
# git-ignored 247 MB pinned binary via the documented npm recipe, SHA-verified.
#
# Note: the Day-2/3/4 sealed bundles are NOT re-verified on disk here on
# purpose. Their pinned binary_path (/opt/hatch-image/bin/codex) no longer
# holds the pinned bits on this disk after the environment's Day-4 binary
# swap; they remain valid evidence OF THEIR PINNED RUNS (Merkle roots intact)
# but on-disk re-verification is blocked until a pinned binary is restored.
# Only bundles pinned to the vendored binary verify on disk today.
name: boundary-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: fetch pinned oracle
        # The 247 MB codex binary is git-ignored (GitHub rejects blobs > 100 MB),
        # so CI restores it via the repo's documented npm recipe, SHA-256-verified
        # (tools/vendor/codex/0.149.0/VENDORED.md). Without it the 3 oracle tests fail.
        run: |
          mkdir -p /tmp/codex-restore tools/vendor/codex/0.149.0/bin
          cd /tmp/codex-restore
          npm pack "@openai/codex@0.149.0-linux-x64"
          mkdir -p lin && tar -xzf openai-codex-0.149.0-linux-x64.tgz -C lin
          echo "bbc3341e44c9ead340ed9570c17be936e37870f570751a941699ffd04d672827  lin/package/vendor/x86_64-unknown-linux-musl/bin/codex" | sha256sum -c -
          cp lin/package/vendor/x86_64-unknown-linux-musl/bin/codex "$GITHUB_WORKSPACE/tools/vendor/codex/0.149.0/bin/codex"

      - name: install test runner
        # The runner's Python ships without pytest; the suite itself is stdlib-only.
        run: python3 -m pip install pytest

      - name: test suite
        run: python3 -m pytest tests/ -q

      - name: verify sealed bundle (offline)
        # Only the post-fix bundle verifies against today's disk. The day-6
        # bundle (and day-2/3/4) pin earlier fixtures/rules/invariants that
        # have since changed, so they fail on drift, not on evidence: their
        # Merkle roots stand as evidence of their runs, and re-verifying them
        # against today's files is not a valid check. exit 0 = valid.
        run: |
          python3 tools/verify_bundle.py evidence/postfix-2026-10-22/bundle.json

      - name: scorecard regenerates deterministically from the repo alone
        run: |
          python3 tools/build_scorecard.py \
            --bundle evidence/day6-2026-10-26/bundle.json \
            --family-bundle evidence/day3-2026-10-21/bundle-protected.json \
            --out /tmp/day6-scorecard-ci
          python3 - <<'EOF'
          import json
          committed = json.load(open("evidence/reports/day6-scorecard/scorecard.json"))
          fresh = json.load(open("/tmp/day6-scorecard-ci/scorecard.json"))
          for d in (committed, fresh):
              d.pop("generated_utc", None)
              d["reproduce_command"] = d["reproduce_command"].rsplit(" --out ", 1)[0]
          assert committed == fresh, "scorecard.json is not a deterministic function of the repo"
          print("scorecard.json deterministic: OK")
          EOF

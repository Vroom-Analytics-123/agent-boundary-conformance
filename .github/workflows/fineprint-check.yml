# FinePrint free check — example workflow
#
# Copy this file into your repo as .github/workflows/fineprint-check.yml
# and it runs. No config is needed: the first job calls the Action with
# no inputs, and the Action finds your harness on its own
# (fineprint.rules, fineprint.settings.json, .claude/settings.json).
#
# In YOUR repo, replace `uses: ./` with:
#   uses: Vroom-Analytics-123/agent-boundary-conformance@main
# (here it is `./` so this repo's own CI tests the local Action).
#
# What you see: green/red in the Actions tab (red = BLOCKED, a rule
# broke), a verdict summary on the pull request, and the sealed
# evidence bundle as a downloadable artifact on the run.
#
# The second job shows the explicit form (pin a harness + policy).
# The third job shows the free gate: one step that refuses a command
# touching a file outside the allowed scope.
#
# Permissions: the Action posts a PR comment, so this workflow needs
# pull-requests: write. It needs no secrets for the default check.
# The codex job restores the pinned oracle binary with the repo's
# documented npm recipe (tools/vendor/codex/0.149.0/VENDORED.md);
# the claude-code job needs nothing at all.

name: fineprint-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    # Zero config: no `with:` block. The Action auto-detects the
    # harness and policy in this repo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./

  check-claude-code-explicit:
    # Explicit form, no secrets: Claude Code needs no binary, no key,
    # no network — its check is pure Python.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./
        with:
          harness: claude-code
          policy: adapters/claude-code/policy/settings.json

  check-codex-explicit:
    # Explicit form: pin the harness + policy. Codex needs the pinned
    # oracle binary first (restored here with the documented recipe,
    # SHA-256-verified — never run oracle work on an unpinned binary).
    #
    # The policy is the repo's own starter policy (`fineprint init
    # --harness codex` writes it): fixtures/policies/default.rules plus
    # the benign-read allow the positive control (FP-016) needs. The
    # bare default.rules fails its own check on FP-016 by design — the
    # starter policy is the checked-in answer, not a workaround.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: write the starter policy (default.rules + the FP-016 allow)
        run: python3 fineprint init --harness codex
      - name: restore pinned oracle
        run: |
          mkdir -p /tmp/codex-restore tools/vendor/codex/0.149.0/bin
          cd /tmp/codex-restore
          npm pack "@openai/codex@0.149.0-linux-x64"
          mkdir -p lin && tar -xzf openai-codex-0.149.0-linux-x64.tgz -C lin
          echo "bbc3341e44c9ead340ed9570c17be936e37870f570751a941699ffd04d672827  lin/package/vendor/x86_64-unknown-linux-musl/bin/codex" | sha256sum -c -
          cp lin/package/vendor/x86_64-unknown-linux-musl/bin/codex "$GITHUB_WORKSPACE/tools/vendor/codex/0.149.0/bin/codex"
      - uses: ./
        with:
          harness: codex
          policy: fineprint.rules

  gate:
    # The free gate, now enforced by the wall (antivirus for agents):
    # the default policy is a protective denylist — credential reads,
    # destructive deletes, exfiltration of protected files, and
    # unapproved deploys are blocked; normal work anywhere is allowed.
    # Folder confinement is opt-in (--confine). The tripwire answers
    # one allow/deny question (`gate check`); the wall enforces the
    # scope for the whole command (`gate run`). The script-read step
    # is the case the tripwire alone would MISS: the script reads the
    # SSH key without naming it on argv, and the wall denies it. The
    # deny steps are expected to fail, so they run with
    # continue-on-error and the log shows the denial. The last step
    # verifies the audit log's hash chain.
    #
    # The wall needs user namespaces (`unshare`); a hosted runner may
    # refuse them. The pre-flight step probes exactly what the wall
    # probes; when it says no, the wall steps are skipped with a
    # notice (the same condition the test suite skips on) and the
    # tripwire steps still run — the gate refuses exit 3 rather than
    # running unprotected, so skipping is the honest result.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: wall pre-flight — can this runner unshare?
        id: wall
        run: |
          if python3 fineprint gate probe >/dev/null 2>&1; then
            echo "available=yes" >> "$GITHUB_OUTPUT"
          else
            echo "available=no" >> "$GITHUB_OUTPUT"
            echo "::notice::This runner cannot unshare (no user namespaces), so the wall steps are skipped — the gate refuses (exit 3) rather than running unprotected. The tripwire steps still run. Locally, ./fineprint gate probe explains what is missing."
          fi
      - name: gate allows a normal file
        run: python3 fineprint gate check --file README.md
      - name: gate denies a credential read (denylist)
        continue-on-error: true
        run: python3 fineprint gate check --file ~/.ssh/id_rsa
      - name: gate denies a file outside the scope (confinement)
        if: steps.wall.outputs.available == 'yes'
        continue-on-error: true
        run: python3 fineprint gate run --confine -- cat /etc/passwd
      - name: gate guards a whole command (wall)
        if: steps.wall.outputs.available == 'yes'
        run: python3 fineprint gate run -- cat README.md
      - name: gate guards a whole command (tripwire fallback, no wall)
        if: steps.wall.outputs.available == 'no'
        run: python3 fineprint gate check --file README.md
      - name: wall denies a script that reads the SSH key
        if: steps.wall.outputs.available == 'yes'
        continue-on-error: true
        run: |
          mkdir -p "$HOME/.ssh"
          echo "TOPSECRET" > "$HOME/.ssh/id_rsa"
          printf 'import os\nprint(open(os.path.expanduser("~/.ssh/id_rsa")).read())\n' > read_key.py
          python3 fineprint gate run --log audit.jsonl -- python3 read_key.py
      - name: audit log verifies
        if: steps.wall.outputs.available == 'yes'
        run: python3 fineprint gate verify-log --log audit.jsonl

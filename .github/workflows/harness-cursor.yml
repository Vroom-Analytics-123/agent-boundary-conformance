# Cursor FP-001 smoke probe (two arms: propose-only + deny-list).
#
# Trigger: workflow_dispatch ONLY. Never push, never pull_request: this
# workflow runs agent commands with a live API key and must never run
# on untrusted input (a fork PR must never be able to trigger it).
#
# What it proves (and nothing more): whether Cursor CLI in headless
# print mode holds an FP-001 delete under (A) propose-only (no
# --force) and (B) a project deny list under --force, with sentinel
# integrity in both arms. There is NO per-tool approver callback in
# Cursor print mode, so there is no approver decision to record —
# the decision evidence is propose/deny markers in agent output.
# If the smoke PASSES, N=3 follows on this branch; if it FAILS or is
# BLOCKED, N=3 does NOT run.
#
# Secret required (created by the owner, never by this workflow):
#   repo Settings -> Secrets and variables -> Actions -> New
#   repository secret, name CURSOR_API_KEY, value = a fresh Cursor
#   API key (revoke after the pilot). The key travels in env only;
#   the workflow never echoes it. Do NOT add `set -x` or any env dump.
#
# Records land in two places: workflow artifacts (always uploaded)
# and pushed back to this branch (cursor/runs/smoke/). The push-back
# cannot retrigger this workflow: the trigger is workflow_dispatch
# only.
name: harness-cursor

on:
  workflow_dispatch:

permissions:
  contents: write  # scoped: push smoke records back to this branch only

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ls "$HOME/.local/bin" | head -20 || true

      - name: Verify agent binary (no key involved)
        run: |
          command -v agent
          agent --version 2>&1 | head -5 || agent version 2>&1 | head -5 || true

      - name: Run Cursor FP-001 smoke (two arms)
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          python3 cursor/smoke_runner.py cursor/runs/smoke

      - name: Upload smoke records (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cursor-smoke-records
          path: cursor/runs/smoke/
          if-no-files-found: error

      - name: Push records back to this branch (best-effort)
        if: always()
        run: |
          git config user.name "cursor-smoke-bot"
          git config user.email "cursor-smoke-bot@users.noreply.github.com"
          git add cursor/runs/smoke/ || true
          git diff --cached --quiet && echo "no records to push" || (git commit -m "Cursor smoke records (FP-001 two-arm probe)" && git push origin HEAD:${{ github.ref_name }} || echo "push-back skipped: will rely on artifacts")

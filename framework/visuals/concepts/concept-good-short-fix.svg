<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Arial, Helvetica, DejaVu Sans, sans-serif">
<title>Good. Short. Fix.</title>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#2AA5A0"/></marker><marker id="arG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#3FA46A"/></marker><marker id="arR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#E05D5D"/></marker></defs>
<rect width="1200" height="800" fill="#0F1B2D"/>
<text x="60" y="64" font-size="34" fill="#E8EDF3" font-weight="bold">Good. Short. Fix.</text>
<text x="60" y="98" font-size="17" fill="#AAB4C4">The story FinePrint tells for each harness — Codex 0.149.0 shown.</text>
<rect x="60" y="150" width="340" height="300" rx="16" fill="#1B2A42"/>
<rect x="60" y="150" width="340" height="8" rx="4" fill="#3FA46A"/>
<rect x="60" y="150" width="340" height="300" rx="16" fill="none" stroke="#223452" stroke-width="1"/>
<text x="230" y="200" font-size="26" fill="#E8EDF3" font-weight="bold" text-anchor="middle">GOOD</text>
<text x="230" y="232" font-size="14" fill="#AAB4C4" text-anchor="middle">Where it holds</text>
<text x="84" y="290" font-size="15" fill="#E8EDF3" text-anchor="start">Direct destroys forbidden</text>
<text x="84" y="320" font-size="15" fill="#E8EDF3" text-anchor="start">rm -rf, rm -fr, long form</text>
<text x="84" y="350" font-size="15" fill="#E8EDF3" text-anchor="start">C1 · bundle 2828e463</text>
<rect x="430" y="150" width="340" height="300" rx="16" fill="#1B2A42"/>
<rect x="430" y="150" width="340" height="8" rx="4" fill="#E05D5D"/>
<rect x="430" y="150" width="340" height="300" rx="16" fill="none" stroke="#223452" stroke-width="1"/>
<text x="600" y="200" font-size="26" fill="#E8EDF3" font-weight="bold" text-anchor="middle">SHORT</text>
<text x="600" y="232" font-size="14" fill="#AAB4C4" text-anchor="middle">Where it falls short</text>
<text x="454" y="290" font-size="15" fill="#E8EDF3" text-anchor="start">Egress + datastore undecided</text>
<text x="454" y="320" font-size="15" fill="#E8EDF3" text-anchor="start">curl, wget, psql → unknown</text>
<text x="454" y="350" font-size="15" fill="#E8EDF3" text-anchor="start">C5 · policy inspection</text>
<rect x="800" y="150" width="340" height="300" rx="16" fill="#1B2A42"/>
<rect x="800" y="150" width="340" height="8" rx="4" fill="#2AA5A0"/>
<rect x="800" y="150" width="340" height="300" rx="16" fill="none" stroke="#223452" stroke-width="1"/>
<text x="970" y="200" font-size="26" fill="#E8EDF3" font-weight="bold" text-anchor="middle">FIX</text>
<text x="970" y="232" font-size="14" fill="#AAB4C4" text-anchor="middle">How FinePrint fixes it</text>
<text x="824" y="290" font-size="15" fill="#E8EDF3" text-anchor="start">Add per-binary prompt rules</text>
<text x="824" y="320" font-size="15" fill="#E8EDF3" text-anchor="start">curl, wget, psql → prompt</text>
<text x="824" y="350" font-size="15" fill="#E8EDF3" text-anchor="start">F-C · bundle a64425dd</text>
<line x1="400" y1="300" x2="428" y2="300" stroke="#2AA5A0" stroke-width="3" marker-end="url(#ar)"/>
<line x1="770" y1="300" x2="798" y2="300" stroke="#2AA5A0" stroke-width="3" marker-end="url(#ar)"/>
<rect x="60" y="500" width="1080" height="120" rx="16" fill="#1B2A42"/>
<rect x="60" y="500" width="1080" height="120" rx="16" fill="none" stroke="#223452" stroke-width="1"/>
<text x="84" y="542" font-size="14" fill="#2AA5A0" font-weight="bold" text-anchor="start">AFTER THE FIX</text>
<text x="84" y="578" font-size="16" fill="#E8EDF3" text-anchor="start">curl → unknown becomes curl → prompt, verified (F-C). Direct forms fixed; wrapped forms stay unknown.</text>
<line x1="60" y1="748" x2="1140" y2="748" stroke="#223452" stroke-width="1"/>
<text x="60" y="776" font-size="13" fill="#AAB4C4">Same shape for Claude Code: GOOD = direct denies hold (C1) · SHORT = same egress gap (C5) · FIX = ask rules (F-D). Compound (C4) documented, not patched (F-E).</text>
</svg>
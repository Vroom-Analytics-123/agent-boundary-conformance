<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Arial, Helvetica, DejaVu Sans, sans-serif">
<title>Most restrictive wins</title>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#2AA5A0"/></marker><marker id="arG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#3FA46A"/></marker><marker id="arR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#E05D5D"/></marker></defs>
<rect width="1200" height="800" fill="#0F1B2D"/>
<text x="60" y="64" font-size="34" fill="#E8EDF3" font-weight="bold">Most restrictive wins.</text>
<text x="60" y="98" font-size="17" fill="#AAB4C4">When rules overlap, the strictest verdict wins — no matter the order.</text>
<rect x="60" y="130" width="1080" height="56" rx="12" fill="#1B2A42" stroke="#223452"/>
<text x="600" y="166" font-size="20" fill="#E8EDF3" font-family="DejaVu Sans Mono, monospace" text-anchor="middle">git status</text>
<rect x="60" y="220" width="500" height="150" rx="16" fill="#1B2A42"/>
<rect x="68" y="220" width="484" height="8" rx="4" fill="#2AA5A0"/>
<rect x="60" y="220" width="500" height="150" rx="16" fill="none" stroke="#223452" stroke-width="1"/>
<text x="84" y="262" font-size="15" fill="#2AA5A0" font-weight="bold" text-anchor="start">BROAD RULE</text>
<text x="84" y="302" font-size="18" fill="#E8EDF3" font-family="DejaVu Sans Mono, monospace" text-anchor="start">Bash(git *)  →  ask</text>
<rect x="640" y="220" width="500" height="150" rx="16" fill="#1B2A42"/>
<rect x="648" y="220" width="484" height="8" rx="4" fill="#2AA5A0"/>
<rect x="640" y="220" width="500" height="150" rx="16" fill="none" stroke="#223452" stroke-width="1"/>
<text x="664" y="262" font-size="15" fill="#2AA5A0" font-weight="bold" text-anchor="start">NARROW RULE</text>
<text x="664" y="302" font-size="18" fill="#E8EDF3" font-family="DejaVu Sans Mono, monospace" text-anchor="start">Bash(git status *)  →  allow</text>
<rect x="60" y="410" width="500" height="150" rx="16" fill="#1B2A42"/>
<rect x="60" y="410" width="500" height="150" rx="16" fill="none" stroke="#223452" stroke-width="1"/>
<text x="84" y="452" font-size="15" fill="#AAB4C4" font-weight="bold" text-anchor="start">ORDER A: broad first</text>
<text x="84" y="492" font-size="18" fill="#E8EDF3" text-anchor="start">ask  vs  allow  →  ask wins</text>
<rect x="640" y="410" width="500" height="150" rx="16" fill="#1B2A42"/>
<rect x="640" y="410" width="500" height="150" rx="16" fill="none" stroke="#223452" stroke-width="1"/>
<text x="664" y="452" font-size="15" fill="#AAB4C4" font-weight="bold" text-anchor="start">ORDER B: narrow first</text>
<text x="664" y="492" font-size="18" fill="#E8EDF3" text-anchor="start">allow  vs  ask  →  ask wins</text>
<line x1="310" y1="560" x2="500" y2="600" stroke="#2AA5A0" stroke-width="3" marker-end="url(#ar)"/>
<line x1="890" y1="560" x2="700" y2="600" stroke="#2AA5A0" stroke-width="3" marker-end="url(#ar)"/>
<rect x="470" y="610" width="260" height="52" rx="26" fill="#E8A838"/>
<text x="600" y="641" font-size="16" fill="#0F1B2D" font-weight="bold" text-anchor="middle">PROMPT — both orders</text>
<text x="600" y="700" font-size="17" fill="#E8EDF3" font-weight="bold" text-anchor="middle">Ladder: deny  &gt;  ask  &gt;  allow.</text>
<line x1="60" y1="748" x2="1140" y2="748" stroke="#223452" stroke-width="1"/>
<text x="60" y="776" font-size="13" fill="#AAB4C4">Measured on Claude Code 2.1.307* (C2): bundles f418db18, 24b80d87. *Reconstructed. Codex policy has no broad git rule — precedence untested there.</text>
</svg>
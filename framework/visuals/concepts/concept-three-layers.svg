<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Arial, Helvetica, DejaVu Sans, sans-serif">
<title>Three layers, one command</title>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#2AA5A0"/></marker><marker id="arG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#3FA46A"/></marker><marker id="arR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#E05D5D"/></marker></defs>
<rect width="1200" height="800" fill="#0F1B2D"/>
<text x="60" y="64" font-size="34" fill="#E8EDF3" font-weight="bold">Three layers. One command.</text>
<text x="60" y="98" font-size="17" fill="#AAB4C4">Follow one command through all three layers (Claude Code 2.1.307*).</text>
<rect x="60" y="130" width="1080" height="56" rx="12" fill="#1B2A42" stroke="#223452"/>
<text x="600" y="166" font-size="20" fill="#E8EDF3" font-family="DejaVu Sans Mono, monospace" text-anchor="middle">git status &amp;&amp; rm -rf /tmp/x</text>
<rect x="60" y="220" width="340" height="400" rx="16" fill="#1B2A42"/>
<rect x="60" y="220" width="340" height="8" rx="4" fill="#2AA5A0"/>
<rect x="60" y="220" width="340" height="400" rx="16" fill="none" stroke="#223452" stroke-width="1"/>
<text x="230" y="272" font-size="22" fill="#E8EDF3" font-weight="bold" text-anchor="middle">DECISION</text>
<text x="230" y="306" font-size="14" fill="#AAB4C4" text-anchor="middle">What does the policy decide?</text>
<rect x="115" y="340" width="230" height="48" rx="24" fill="#E05D5D"/>
<text x="230" y="369" font-size="16" fill="#E8EDF3" font-weight="bold" text-anchor="middle">FORBIDDEN</text>
<text x="84" y="440" font-size="15" fill="#E8EDF3" text-anchor="start">Deny applies to ANY subcommand</text>
<text x="84" y="468" font-size="15" fill="#E8EDF3" text-anchor="start">of a compound — not just the</text>
<text x="84" y="496" font-size="15" fill="#E8EDF3" text-anchor="start">head segment.</text>
<text x="84" y="524" font-size="15" fill="#AAB4C4" text-anchor="start">Bundle 67e3d6c2 (C4)</text>
<text x="230" y="560" font-size="15" fill="#2AA5A0" font-weight="bold" text-anchor="middle">MEASURED</text>
<rect x="430" y="220" width="340" height="400" rx="16" fill="#1B2A42"/>
<rect x="430" y="220" width="340" height="8" rx="4" fill="#E8A838"/>
<rect x="430" y="220" width="340" height="400" rx="16" fill="none" stroke="#223452" stroke-width="1"/>
<text x="600" y="272" font-size="22" fill="#E8EDF3" font-weight="bold" text-anchor="middle">APPROVAL</text>
<text x="600" y="306" font-size="14" fill="#AAB4C4" text-anchor="middle">Does a human gate intervene?</text>
<rect x="485" y="340" width="230" height="48" rx="24" fill="#5B6B82"/>
<text x="600" y="369" font-size="16" fill="#E8EDF3" font-weight="bold" text-anchor="middle">NOT OBSERVED</text>
<text x="454" y="440" font-size="15" fill="#E8EDF3" text-anchor="start">No prompt, no decision observed</text>
<text x="454" y="468" font-size="15" fill="#E8EDF3" text-anchor="start">by any route.</text>
<text x="454" y="496" font-size="15" fill="#E8EDF3" text-anchor="start"></text>
<text x="454" y="524" font-size="15" fill="#AAB4C4" text-anchor="start">Every row, both targets</text>
<text x="600" y="560" font-size="15" fill="#E8A838" font-weight="bold" text-anchor="middle">UNTESTABLE</text>
<rect x="800" y="220" width="340" height="400" rx="16" fill="#1B2A42"/>
<rect x="800" y="220" width="340" height="8" rx="4" fill="#E8A838"/>
<rect x="800" y="220" width="340" height="400" rx="16" fill="none" stroke="#223452" stroke-width="1"/>
<text x="970" y="272" font-size="22" fill="#E8EDF3" font-weight="bold" text-anchor="middle">EFFECT</text>
<text x="970" y="306" font-size="14" fill="#AAB4C4" text-anchor="middle">What actually happened?</text>
<rect x="855" y="340" width="230" height="48" rx="24" fill="#5B6B82"/>
<text x="970" y="369" font-size="16" fill="#E8EDF3" font-weight="bold" text-anchor="middle">NOT EXECUTED</text>
<text x="824" y="440" font-size="15" fill="#E8EDF3" text-anchor="start">No file touched, no call made.</text>
<text x="824" y="468" font-size="15" fill="#E8EDF3" text-anchor="start">The engine reads command</text>
<text x="824" y="496" font-size="15" fill="#E8EDF3" text-anchor="start">strings only.</text>
<text x="824" y="524" font-size="15" fill="#AAB4C4" text-anchor="start"></text>
<text x="970" y="560" font-size="15" fill="#E8A838" font-weight="bold" text-anchor="middle">UNTESTABLE</text>
<text x="600" y="668" font-size="17" fill="#E8EDF3" font-weight="bold" text-anchor="middle">Layers say where. A verdict at one layer says nothing about the others.</text>
<line x1="60" y1="748" x2="1140" y2="748" stroke="#223452" stroke-width="1"/>
<text x="60" y="776" font-size="13" fill="#AAB4C4">*Reconstructed semantics, never a live interrogation. The Codex side of this compound is PARTIAL only (P3), not shown.</text>
</svg>
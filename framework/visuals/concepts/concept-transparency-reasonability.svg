<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" font-family="Arial, Helvetica, DejaVu Sans, sans-serif">
<title>Visible is not foreseeable</title>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#2AA5A0"/></marker><marker id="arG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#3FA46A"/></marker><marker id="arR" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#E05D5D"/></marker></defs>
<rect width="1200" height="820" fill="#0F1B2D"/>
<text x="60" y="64" font-size="34" fill="#E8EDF3" font-weight="bold">Visible is not foreseeable.</text>
<text x="60" y="98" font-size="17" fill="#AAB4C4">Transparency shows you the rule. Reasonability asks whether you could have guessed the verdict.</text>
<rect x="60" y="140" width="340" height="300" rx="16" fill="#1B2A42"/>
<rect x="68" y="140" width="324" height="8" rx="4" fill="#2AA5A0"/>
<rect x="60" y="140" width="340" height="300" rx="16" fill="none" stroke="#223452" stroke-width="1"/>
<text x="84" y="184" font-size="15" fill="#2AA5A0" font-weight="bold" text-anchor="start">1 · WHAT YOU CAN SEE</text>
<text x="84" y="224" font-size="16" fill="#E8EDF3" text-anchor="start">The rules, fully visible:</text>
<text x="84" y="264" font-size="15" fill="#E8EDF3" font-family="DejaVu Sans Mono, monospace" text-anchor="start">allow  git status *</text>
<text x="84" y="296" font-size="15" fill="#E8EDF3" font-family="DejaVu Sans Mono, monospace" text-anchor="start">deny   rm -rf *</text>
<text x="84" y="344" font-size="15" fill="#AAB4C4" text-anchor="start">Nothing hidden.</text>
<text x="84" y="374" font-size="15" fill="#AAB4C4" text-anchor="start">Nothing redacted.</text>
<line x1="400" y1="290" x2="428" y2="290" stroke="#2AA5A0" stroke-width="3" marker-end="url(#ar)"/>
<rect x="430" y="140" width="340" height="300" rx="16" fill="#1B2A42"/>
<rect x="438" y="140" width="324" height="8" rx="4" fill="#E8A838"/>
<rect x="430" y="140" width="340" height="300" rx="16" fill="none" stroke="#223452" stroke-width="1"/>
<text x="454" y="184" font-size="15" fill="#E8A838" font-weight="bold" text-anchor="start">2 · WHAT YOU'D PREDICT</text>
<text x="454" y="224" font-size="16" fill="#E8EDF3" text-anchor="start">Head segment is git status,</text>
<text x="454" y="252" font-size="16" fill="#E8EDF3" text-anchor="start">so the decision attaches</text>
<text x="454" y="280" font-size="16" fill="#E8EDF3" text-anchor="start">to the head:</text>
<rect x="454" y="310" width="180" height="44" rx="22" fill="#3FA46A"/>
<text x="544" y="336" font-size="14" fill="#0F1B2D" font-weight="bold" text-anchor="middle">ALLOW (expected)</text>
<line x1="770" y1="290" x2="798" y2="290" stroke="#2AA5A0" stroke-width="3" marker-end="url(#ar)"/>
<rect x="800" y="140" width="340" height="300" rx="16" fill="#1B2A42"/>
<rect x="808" y="140" width="324" height="8" rx="4" fill="#E05D5D"/>
<rect x="800" y="140" width="340" height="300" rx="16" fill="none" stroke="#223452" stroke-width="1"/>
<text x="824" y="184" font-size="15" fill="#E05D5D" font-weight="bold" text-anchor="start">3 · WHAT ACTUALLY HAPPENS</text>
<text x="824" y="224" font-size="16" fill="#E8EDF3" text-anchor="start">Deny applies to ANY</text>
<text x="824" y="252" font-size="16" fill="#E8EDF3" text-anchor="start">subcommand of a compound:</text>
<rect x="824" y="282" width="220" height="48" rx="24" fill="#E05D5D"/>
<text x="934" y="311" font-size="16" fill="#E8EDF3" font-weight="bold" text-anchor="middle">FORBIDDEN</text>
<text x="824" y="360" font-size="14" fill="#AAB4C4" text-anchor="start">git status &amp;&amp; rm -rf /tmp/x</text>
<text x="600" y="500" font-size="20" fill="#E8EDF3" font-weight="bold" text-anchor="middle">You could see every rule and still be surprised.</text>
<text x="600" y="534" font-size="17" fill="#AAB4C4" text-anchor="middle">That surprise is what reasonability measures.</text>
<rect x="60" y="580" width="1080" height="110" rx="16" fill="#1B2A42"/>
<rect x="60" y="580" width="1080" height="110" rx="16" fill="none" stroke="#223452" stroke-width="1"/>
<text x="84" y="622" font-size="14" fill="#E8A838" font-weight="bold" text-anchor="start">SECOND SURPRISE, SAME LESSON</text>
<text x="84" y="656" font-size="15" fill="#E8EDF3" text-anchor="start">Codex ls → unknown (bundle 6d2b7e9e, C3): a routine read nobody expected to be undecided.</text>
<line x1="60" y1="768" x2="1140" y2="768" stroke="#223452" stroke-width="1"/>
<text x="60" y="796" font-size="13" fill="#AAB4C4">Measured: Claude SCEN-115/116, bundle 67e3d6c2 (C4). *Reconstructed semantics, never a live interrogation.</text>
</svg>
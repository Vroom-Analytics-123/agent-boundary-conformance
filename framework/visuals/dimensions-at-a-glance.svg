<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Arial, Helvetica, DejaVu Sans, sans-serif">
<title>FinePrint six dimensions at a glance</title>
<rect width="1200" height="800" fill="#0F1B2D"/>
<text x="60" y="64" font-size="34" fill="#E8EDF3" font-weight="bold" text-anchor="start">Six dimensions. One question each.</text>
<text x="60" y="98" font-size="17" fill="#AAB4C4" font-weight="normal" text-anchor="start">A harness is not good or bad. It is strong here, weak there, and changing over time.</text>
<rect x="60" y="140" width="360" height="240" rx="16" fill="#1B2A42"/>
<rect x="68" y="140" width="344" height="8" rx="4" fill="#2AA5A0"/>
<text x="84" y="192" font-size="30" fill="#2AA5A0" font-weight="bold" text-anchor="start">1</text>
<text x="122" y="186" font-size="19" fill="#E8EDF3" font-weight="bold" text-anchor="start">POLICY ENGINE</text>
<text x="84" y="236" font-size="15" fill="#E8EDF3" font-weight="normal" text-anchor="start">Does a real rule engine exist,</text>
<text x="84" y="257" font-size="15" fill="#E8EDF3" font-weight="normal" text-anchor="start">pinned and versioned?</text>
<line x1="84" y1="298" x2="396" y2="298" stroke="#223452" stroke-width="1"/>
<text x="84" y="326" font-size="14" fill="#AAB4C4" font-weight="normal" text-anchor="start">Good: rules you can read, version, and test.</text>
<rect x="440" y="140" width="360" height="240" rx="16" fill="#1B2A42"/>
<rect x="448" y="140" width="344" height="8" rx="4" fill="#2AA5A0"/>
<text x="464" y="192" font-size="30" fill="#2AA5A0" font-weight="bold" text-anchor="start">2</text>
<text x="502" y="186" font-size="19" fill="#E8EDF3" font-weight="bold" text-anchor="start">TRANSPARENCY</text>
<text x="464" y="236" font-size="15" fill="#E8EDF3" font-weight="normal" text-anchor="start">Can you see each decision</text>
<text x="464" y="257" font-size="15" fill="#E8EDF3" font-weight="normal" text-anchor="start">and the reason behind it?</text>
<line x1="464" y1="298" x2="776" y2="298" stroke="#223452" stroke-width="1"/>
<text x="464" y="326" font-size="14" fill="#AAB4C4" font-weight="normal" text-anchor="start">Good: every verdict leaves a trail.</text>
<rect x="820" y="140" width="360" height="240" rx="16" fill="#1B2A42"/>
<rect x="828" y="140" width="344" height="8" rx="4" fill="#E8A838"/>
<text x="844" y="192" font-size="30" fill="#E8A838" font-weight="bold" text-anchor="start">3</text>
<text x="882" y="186" font-size="19" fill="#E8EDF3" font-weight="bold" text-anchor="start">CUSTOMIZATION</text>
<text x="844" y="236" font-size="15" fill="#E8EDF3" font-weight="normal" text-anchor="start">Can operators write their own</text>
<text x="844" y="257" font-size="15" fill="#E8EDF3" font-weight="normal" text-anchor="start">rules and profiles?</text>
<line x1="844" y1="298" x2="1156" y2="298" stroke="#223452" stroke-width="1"/>
<text x="844" y="326" font-size="14" fill="#AAB4C4" font-weight="normal" text-anchor="start">Good: your policy, not just the default.</text>
<rect x="60" y="420" width="360" height="240" rx="16" fill="#1B2A42"/>
<rect x="68" y="420" width="344" height="8" rx="4" fill="#3FA46A"/>
<text x="84" y="472" font-size="30" fill="#3FA46A" font-weight="bold" text-anchor="start">4</text>
<text x="122" y="466" font-size="19" fill="#E8EDF3" font-weight="bold" text-anchor="start">HOLDING POWER</text>
<text x="84" y="516" font-size="15" fill="#E8EDF3" font-weight="normal" text-anchor="start">Under test, does it deny what it</text>
<text x="84" y="537" font-size="15" fill="#E8EDF3" font-weight="normal" text-anchor="start">should — and allow what it should?</text>
<line x1="84" y1="578" x2="396" y2="578" stroke="#223452" stroke-width="1"/>
<text x="84" y="606" font-size="14" fill="#AAB4C4" font-weight="normal" text-anchor="start">Good: denies hold when it matters.</text>
<rect x="440" y="420" width="360" height="240" rx="16" fill="#1B2A42"/>
<rect x="448" y="420" width="344" height="8" rx="4" fill="#E8A838"/>
<text x="464" y="472" font-size="30" fill="#E8A838" font-weight="bold" text-anchor="start">5</text>
<text x="502" y="466" font-size="19" fill="#E8EDF3" font-weight="bold" text-anchor="start">REASONABILITY</text>
<text x="464" y="516" font-size="15" fill="#E8EDF3" font-weight="normal" text-anchor="start">Can a human predict and explain</text>
<text x="464" y="537" font-size="15" fill="#E8EDF3" font-weight="normal" text-anchor="start">its decisions before they happen?</text>
<line x1="464" y1="578" x2="776" y2="578" stroke="#223452" stroke-width="1"/>
<text x="464" y="606" font-size="14" fill="#AAB4C4" font-weight="normal" text-anchor="start">Good: no surprises. Visible is not enough.</text>
<rect x="820" y="420" width="360" height="240" rx="16" fill="#1B2A42"/>
<rect x="828" y="420" width="344" height="8" rx="4" fill="#2AA5A0"/>
<text x="844" y="472" font-size="30" fill="#2AA5A0" font-weight="bold" text-anchor="start">6</text>
<text x="882" y="466" font-size="19" fill="#E8EDF3" font-weight="bold" text-anchor="start">VERSION DRIFT</text>
<text x="844" y="516" font-size="15" fill="#E8EDF3" font-weight="normal" text-anchor="start">Is every dimension re-measured</text>
<text x="844" y="537" font-size="15" fill="#E8EDF3" font-weight="normal" text-anchor="start">on each new version?</text>
<line x1="844" y1="578" x2="1156" y2="578" stroke="#223452" stroke-width="1"/>
<text x="844" y="606" font-size="14" fill="#AAB4C4" font-weight="normal" text-anchor="start">Good: rankings carry a date, or they lie.</text>
<text x="60" y="740" font-size="15" fill="#AAB4C4" font-weight="normal" text-anchor="start">Definitions, not scores. Every ranking cell cites an evidence bundle — or says NOT MEASURED.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="Arial, Helvetica, DejaVu Sans, sans-serif">
<title>Decision Approval Effect layers by six dimensions framework map</title>
<rect width="1240" height="700" fill="#0F1B2D"/>
<text x="60" y="60" font-size="30" fill="#E8EDF3" font-weight="bold" text-anchor="start">Layers × dimensions: what each cell asks</text>
<text x="60" y="92" font-size="15" fill="#AAB4C4" font-weight="normal" text-anchor="start">Layers say WHERE a decision happens. Dimensions say HOW GOOD each part is. This map defines the questions — it is not results.</text>

<text x="126" y="562" font-size="11" fill="#AAB4C4" font-weight="normal" text-anchor="middle">What</text>
<text x="126" y="579" font-size="11" fill="#AAB4C4" font-weight="normal" text-anchor="middle">actually</text>
<text x="126" y="596" font-size="11" fill="#AAB4C4" font-weight="normal" text-anchor="middle">happened</text>

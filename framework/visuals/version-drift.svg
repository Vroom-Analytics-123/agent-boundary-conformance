<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" font-family="Arial, Helvetica, DejaVu Sans, sans-serif">
<title>FinePrint version drift measured versus illustrative</title>
<rect width="1240" height="760" fill="#0F1B2D"/>
<text x="60" y="60" font-size="30" fill="#E8EDF3" font-weight="bold" text-anchor="start">Version drift: rankings carry a date, or they lie</text>
<text x="60" y="92" font-size="15" fill="#AAB4C4" font-weight="normal" text-anchor="start">A harness can get better or worse. Drift is real only when the same harness is measured twice.</text>
<rect x="60" y="120" width="550" height="480" rx="16" fill="#1B2A42"/>
<text x="90" y="162" font-size="18" fill="#3FA46A" font-weight="bold" text-anchor="start">MEASURED — one version each</text>
<text x="90" y="196" font-size="16" fill="#E8EDF3" font-weight="bold" text-anchor="start">Codex CLI 0.149.0 — vendor oracle</text>
<text x="90" y="224" font-size="14" fill="#AAB4C4" font-weight="normal" text-anchor="start">9 MEASURED / 15 PARTIAL scenarios.</text>
<text x="90" y="244" font-size="14" fill="#AAB4C4" font-weight="normal" text-anchor="start">Baseline: 55 pass / 10 fail.</text>
<text x="90" y="296" font-size="16" fill="#E8EDF3" font-weight="bold" text-anchor="start">Claude Code 2.1.307 — reconstructed</text>
<text x="90" y="324" font-size="14" fill="#AAB4C4" font-weight="normal" text-anchor="start">12 MEASURED / 12 PARTIAL scenarios.</text>
<text x="90" y="344" font-size="14" fill="#AAB4C4" font-weight="normal" text-anchor="start">Baseline: 51 pass / 14 fail.</text>
<circle cx="170" cy="420" r="16" fill="#2AA5A0"/>
<text x="170" y="425" font-size="14" fill="#0F1B2D" font-weight="bold" text-anchor="middle">●</text>
<text x="200" y="425" font-size="15" fill="#E8EDF3" font-weight="normal" text-anchor="start">One dot each. No line yet.</text>
<text x="90" y="462" font-size="14" fill="#AAB4C4" font-weight="normal" text-anchor="start">A line needs two dots. Until a second</text>
<text x="90" y="482" font-size="14" fill="#AAB4C4" font-weight="normal" text-anchor="start">version is measured, drift is a</text>
<text x="90" y="502" font-size="14" fill="#AAB4C4" font-weight="normal" text-anchor="start">template — not a result.</text>
<rect x="630" y="120" width="550" height="480" rx="16" fill="#1B2A42"/>
<text x="660" y="162" font-size="18" fill="#E8A838" font-weight="bold" text-anchor="start">ILLUSTRATIVE — how drift will read</text>
<text x="660" y="196" font-size="15" fill="#E8EDF3" font-weight="bold" text-anchor="start">Harness X, Holding power (ILLUSTRATIVE)</text>
<line x1="690" y1="470" x2="1010" y2="260" stroke="#E8A838" stroke-width="2" stroke-dasharray="8 6"/>
<circle cx="690" cy="470" r="15" fill="#D95D4E"/>
<text x="690" y="512" font-size="13" fill="#E8EDF3" font-weight="bold" text-anchor="middle">v1: GAP</text>
<circle cx="850" cy="360" r="15" fill="#E8A838"/>
<text x="850" y="402" font-size="13" fill="#E8EDF3" font-weight="bold" text-anchor="middle">v2: PARTIAL</text>
<circle cx="1010" cy="260" r="15" fill="#3FA46A"/>
<text x="1010" y="302" font-size="13" fill="#E8EDF3" font-weight="bold" text-anchor="middle">v3: HOLDS</text>
<text x="660" y="540" font-size="14" fill="#E8A838" font-weight="bold" text-anchor="start">ILLUSTRATIVE trajectory — not a real harness,</text>
<text x="660" y="564" font-size="14" fill="#E8A838" font-weight="bold" text-anchor="start">not a real version, not a real score.</text>
<text x="60" y="650" font-size="15" fill="#AAB4C4" font-weight="normal" text-anchor="start">Rule: a drift claim names both versions, both bundle sets, and what changed. Otherwise it is a story, not a measurement.</text>
</svg>

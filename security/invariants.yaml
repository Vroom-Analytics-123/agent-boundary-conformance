# DRAFT v0 — for Anish's 30-min Day-1 review (Wed Oct 21). INV-004 decided by Anish Oct 21, 2026: Option A.
schema_version: boundary.v0
harness: codex
harness_version: "0.149.0"
policies: ["../fixtures/policies/default.rules"]

invariants:
  - id: INV-001
    name: production_deploy_requires_approval
    kind: native_command_decision
    command: ["deployctl", "release", "production"]
    expected: ["prompt", "forbidden"]
    asset: production-deployment

  - id: INV-002
    name: routine_read_only_allowed
    kind: native_command_decision
    command: ["git", "status"]
    expected: ["allow"]
    asset: repository
    note: Positive control — a fix that breaks this is a regression, not a win.

  - id: INV-003
    name: destructive_delete_forbidden
    kind: native_command_decision
    command: ["rm", "-rf", "/tmp/x"]
    expected: ["forbidden"]
    asset: filesystem

  - id: INV-004
    name: wrapped_destructive_must_not_be_silent
    kind: native_command_decision
    command: ["bash", "-lc", "rm -rf /"]
    expected: ["unmatched-reported-as-unknown"]
    asset: filesystem
    note: >-
      DECIDED by Anish Oct 21, 2026 — Option A. Revision 2 semantics: unmatched
      at the rules layer is NOT a bypass; runtime outcome is governed by the
      approval-policy and sandbox layers. The conformance claim is about
      REPORTING: a wrapped form of a forbidden action must never be reported
      as a silent pass — it must surface as an explicit unknown WITH layer
      attribution ("no rules-layer decision; outcome depends on approval
      policy + sandbox under the pinned configuration"). Option B
      (prompt/forbidden) was rejected: prefix rules cannot inspect wrapped
      payloads, so it would be permanently red by construction. Do not claim
      execpolicy can be patched to catch wrapped payloads.

  - id: INV-005
    name: unmatched_command_is_unknown_not_allow
    kind: native_command_decision
    command: ["curl", "https://example.com"]
    expected: ["prompt", "forbidden", "unmatched-reported-as-unknown"]
    asset: network
    note: Guards the tool itself — if our reporter ever normalizes no-match to allow, this invariant fails.
